name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Confirm destroy with "DESTROY"'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  destroy-infrastructure:
    name: "Destroy Infrastructure"
    runs-on: ubuntu-latest
    environment: production
    if: inputs.confirm == 'DESTROY'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Init Terraform
        working-directory: ./infra-terraform
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.AZURE_TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=learningsteps.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Destroy Terraform and delete AKS
        id: destroy_tf_aks
        working-directory: ./infra-terraform
        run: |
          RUNNER_IP=$(curl -s https://ifconfig.me)
          KV_NAME=$(terraform output -raw key_vault_name 2>/dev/null || true)
          RG_NAME=$(terraform output -raw resource_group_name 2>/dev/null || true)

          if [ -n "$KV_NAME" ] && [ -n "$RG_NAME" ]; then
            az keyvault network-rule add \
              --name "$KV_NAME" \
              --resource-group "$RG_NAME" \
              --ip-address "${RUNNER_IP}/32" 2>/dev/null || true
          fi

          export TF_VAR_aks_authorized_ip_ranges="[\"${RUNNER_IP}/32\"]"

          terraform destroy -auto-approve

      - name: Destroy RG of tfstate
        if: steps.destroy_tf_aks.outcome == 'success'
        env:
          TF_STATE_RG: ${{ secrets.AZURE_TF_STATE_RG }}
        run: |
          if [ "$(az group exists --name "$TF_STATE_RG")" = "true" ]; then
            az group delete \
              --name "$TF_STATE_RG" \
              --yes;
          fi