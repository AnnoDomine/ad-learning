# ==============================================================================
# CI Workflow – Python Linting, Formatting & Smoke Tests
# ==============================================================================
# Runs exclusively on pushes/PRs targeting `main` (plus manual dispatch) to
# conserve CI minutes while guarding code quality before releases.
# All third-party actions are pinned to full commit SHAs for supply-chain safety.

name: Lint learningsteps

on:
  push:
    branches: "main"

  pull_request:
    branches: "main"

  workflow_dispatch:

jobs:
  ruff:
    name: Lint and Format check via Ruff
    runs-on: ubuntu-latest
    # Least-privilege token: lint checks only read repository source files
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Runs `ruff check` on the API package using rules in `learningsteps/ruff.toml`
      - name: Run ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          src: learningsteps/api/

      # Verify consistent code formatting across both API code and tests
      - name: Verify formatting with ruff
        run: ruff format --check --diff
        working-directory: ./learningsteps

  pytest:
    name: Unit tests via PyTest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.13

      - name: Install dependencies
        working-directory: learningsteps/
        run: |
          python -m pip install --upgrade pip
          if [ -f api/requirements.txt ]; then pip install -r api/requirements.txt; fi
          # Install test/coverage tooling (`httpx` is required by FastAPI TestClient)
          pip install pytest coverage httpx

      - name: Test with pytest
        working-directory: learningsteps/
        # `postgres_repository.py` validates DATABASE_URL presence at module import time;
        # provide a non-routable placeholder since smoke tests do not connect to a live DB
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
        run: |
          # Set PYTHONPATH=api so `from main import app` resolves internal `routers.*` imports,
          # and target `tests/` explicitly to exclude the manual E2E script `test_api.py`
          PYTHONPATH=api coverage run -m pytest tests/ -v -s

      - name: Generate Coverage Report
        working-directory: learningsteps/
        run: |
          coverage report -m
