name: Lint learningsteps

on:
  push:
    branches: "main"

  pull_request:
    branches: "main"

  workflow_dispatch:

jobs:
  ruff:
    name: Lint and Format check via Ruff
    runs-on: ubuntu-latest
    permissions:
        contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          src: learningsteps/api/
      - run: ruff format --check --diff
        working-directory: ./learningsteps

  pytest:
    name: Unit tests via PyTest
    runs-on: ubuntu-latest
    permissions:
        contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.13
      - name: Install dependencies
        working-directory: learningsteps/
        run: |
          python -m pip install --upgrade pip  
          if [ -f api/requirements.txt ]; then pip install -r api/requirements.txt; fi
          pip install pytest coverage httpx
      - name: Test with pytest
        working-directory: learningsteps/
        run: |
          PYTHONPATH=api coverage run -m pytest tests/ -v -s
      - name: Generate Coverage Report
        working-directory: learningsteps/
        run: |
          coverage report -m
