# ==============================================================================
# Release Workflow – Semantic Tagging Trigger
# ==============================================================================
# Manually creates and pushes an annotated semantic version tag (`v<version>`)
# strictly from `main`. Pushing the tag automatically triggers `deploy.yml`
# (`push.tags: "v*.*.*"`), keeping release deployments explicit and auditable.

name: Release Tagging Pipeline

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for tag (e.g. 0.1.0 -> creates v0.1.0)'
        required: true
        type: string

# Write access is required solely to push the newly created Git tag
permissions:
  contents: write

jobs:
  tag:
    name: Create & Push Git Tag
    runs-on: ubuntu-latest
    # Enforce tagging from `main` only so unreviewed feature branches cannot release
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Author
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"

      - name: Create and Push Tag
        run: |
          TAG_NAME="v${{ inputs.version }}"
          echo "Checking if tag $TAG_NAME already exists..."
          # Guard against overwriting an existing release tag
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Error: Tag $TAG_NAME already exists!" >&2
            exit 1
          fi

          echo "Creating tag $TAG_NAME..."
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"
