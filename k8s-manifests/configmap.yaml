# ==============================================================================
# ConfigMap – Non-Sensitive Database Connection Settings
# ==============================================================================
# Provides PostgreSQL host, database name, and user to the FastAPI pods.
# `${DATABASE_FQDN}` is dynamically substituted via `envsubst` in `deploy.yml`
# from Terraform outputs prior to `kubectl apply`.

apiVersion: v1
kind: ConfigMap
metadata:
  name: learningsteps-config
data:
  POSTGRES_USER: "evo_ls_psql"
  POSTGRES_DB: "postgres"
  POSTGRES_HOST: "${DATABASE_FQDN}"
