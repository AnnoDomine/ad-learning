# ==============================================================================
# HorizontalPodAutoscaler – CPU-Based Pod Scaling
# ==============================================================================
# Maintains 2-5 replicas of `learningsteps-api` and scales out automatically
# whenever average pod CPU utilization exceeds 70% of requested CPU (`100m`).

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: learningsteps-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: learningsteps-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
