# ==============================================================================
# SecretProviderClass – Azure Key Vault Secrets Store CSI Driver
# ==============================================================================
# Fetches `db-admin-password` directly from Azure Key Vault at pod startup using
# the AKS CSI Driver managed identity (`useVMManagedIdentity: "true"`) and mirrors
# it into a Kubernetes Secret (`learningsteps-db-secret`) so the deployment can
# inject it as an environment variable.
#
# Placeholders (`${...}`) are substituted via `envsubst` in `deploy.yml`:
#   - `${TENANT_ID}` comes from `secrets.AZURE_TENANT_ID` (GitHub strips matching outputs)
#   - `${AKS_KV_IDENTITY_CLIENT_ID}` & `${KEY_VAULT_NAME}` come from Terraform outputs

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv-learningsteps
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "${AKS_KV_IDENTITY_CLIENT_ID}"
    keyvaultName: "${KEY_VAULT_NAME}"
    tenantId: "${TENANT_ID}"
    # Azure CSI provider parses the `objects` list from a multi-line YAML string
    objects: |
      array:
        - |
          objectName: db-admin-password
          objectType: secret
  # Synchronize Key Vault secret into a native K8s Secret when mounted by a pod
  secretObjects:
    - secretName: learningsteps-db-secret
      type: Opaque
      data:
        - objectName: db-admin-password
          key: DB_PASSWORD
