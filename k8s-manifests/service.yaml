# ==============================================================================
# Service – Public Azure LoadBalancer
# ==============================================================================
# Exposes the LearningSteps API publicly on HTTP port 80 and forwards traffic
# to Uvicorn on container port 8000 for pods matching `app: learningsteps-api`.

apiVersion: v1
kind: Service
metadata:
  name: learningsteps-api-service
spec:
  type: LoadBalancer
  selector:
    app: learningsteps-api
  ports:
    - port: 80
      targetPort: 8000
